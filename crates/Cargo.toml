[workspace]
members = [
    "checked-read",
    "fhe-input",
    "fork-kit",
    "frame-accounts",
    "frame-device-key",
    "frame-enclave",
    "frame-display",
    "frame-exit",
    "frame-kit",
    "frame-pool",
    "frame-registry",
    "frame-secrets",
    "frame-ticket",
    "frame-wallet",
    "merkle-tree",
    "noir-transfer",
    "ticket-read",
    "tornadocash",
    "tornadocash-circuit",
    "tornadocash-keychain",
    "userop-kit",
    "witness-share",
]
resolver = "3"

[workspace.lints.clippy]
cast_possible_truncation = { level = "allow" }
missing_errors_doc = { level = "allow" }
pedantic = { level = "warn", priority = -1 }
result_large_err = { level = "allow" }

[workspace.dependencies]
aes-gcm = "0.10.3"
alloy = "2.4.1"
alloy-sol-types = "1.7"
argon2 = "0.5.3"
anyhow = "1.0.104"
ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
async-trait = "0.1.92"
axum = "0.8"
blake-hash = "0.2.0"
blst = "0.3.16"
brotli = "9.0.0"
cfg_aliases = "0.2.2"
commonware-codec = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-math = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-utils = "2026.9.0"
criterion = "0.8.2"
flate2 = "1.1"
futures = "0.3"
hkdf = "0.12.4"
hex = "0.4.3"
insta = "1.48.0"
k256 = "0.13.4"
kohaku-checked-read = { path = "checked-read" }
kohaku-fork-kit = { path = "fork-kit" }
kohaku-frame-accounts = { path = "frame-accounts" }
kohaku-frame-device-key = { path = "frame-device-key" }
kohaku-frame-enclave = { path = "frame-enclave" }
kohaku-frame-display = { path = "frame-display" }
kohaku-frame-exit = { path = "frame-exit" }
kohaku-frame-kit = { path = "frame-kit" }
kohaku-frame-pool = { path = "frame-pool" }
kohaku-frame-registry = { path = "frame-registry" }
kohaku-frame-secrets = { path = "frame-secrets" }
kohaku-frame-ticket = { path = "frame-ticket" }
kohaku-frame-wallet = { path = "frame-wallet" }
kohaku-merkle-tree = { path = "merkle-tree" }
# The PIR router of upstream kohaku-rs's `experiments/pir-v1` branch, at the commit read.
kohaku-pir-rpc = { git = "https://github.com/ethereum/kohaku-rs", rev = "6dc83a4bcb5bf828d16478358467ed2cabcdb8b9" }
kohaku-ticket-read = { path = "ticket-read" }
kohaku-tornadocash = { path = "tornadocash" }
kohaku-tornadocash-circuit = { path = "tornadocash-circuit" }
kohaku-tornadocash-keychain = { path = "tornadocash-keychain" }
kohaku-userop-kit = { path = "userop-kit" }
num-bigint = "0.5.1"
num-traits = "0.2.19"
postcard = "1.1.3"
rand = "0.10.2"
rand_chacha = "0.10"
rayon = "1.12"
redb = "4.3.0"
reqwest = "0.13.4"
ruint = "1.20.0"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
websnark-rs = "0.8.0"
